services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    expose:
      - "3001"
    env_file:
      - apps/backend/.env
    environment:
      - HOST_DB=host.docker.internal
      - HOST_QUEUE=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
