<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Private, authenticated financial app: never index user data or auth screens. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="color-scheme" content="dark light" />
    <!-- description/theme-color are injected from app.json to avoid duplicate tags. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance Flow" />
    <!-- Apply the saved theme before React mounts so a reload never flashes dark. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('finance_flow_theme');
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var mode = saved === 'light' || saved === 'dark' ? saved : system;
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.content = mode === 'light' ? '#e9efec' : '#101516';
        } catch (e) {}
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Dark default prevents a white first paint before the inline theme script. */
      html,
      body,
      #root {
        background: #101516;
      }
      html[data-theme='dark'] body,
      html[data-theme='dark'] #root {
        background: #101516;
      }
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #e9efec;
      }
    </style>
  </head>

  <body>
    <noscript>
      Necesitas habilitar JavaScript para usar esta aplicación.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
